<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #f8fafc; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    button {
      margin-top: 20px; padding: 10px 20px; border-radius: 8px; border: none;
      background: #d4af37; color: #0f172a; font-weight: 600; font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page needs a connection. Once you're back online, your invoices, customers, and payments will sync normally.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
